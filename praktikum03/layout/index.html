<!DOCTYPE html>
<a<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: rgb(0, 50, 252);
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color: rgb(255, 0, 0);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            border: 1px solid;
        }

        nav {
            background-color: rgb(162, 255, 0);
            padding: 15px;
            flex: 1;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
        }

        .main-content {
            display: flex;
            gap: 10px;
        }

        article {
            flex: 3;
            background-color: rgb(0, 255, 0);
            padding: 15px;
            border: 1px solid rgb(0, 0, 0);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        section {
            background-color: rgb(255, 111, 0);
            padding: 15px;
            border: 1px solid rgb(0, 0, 0);
            flex: 1;
            display: flex;
            align-items: center;
        }

        aside {
            flex: 1;
            background-color: rgb(255, 0, 179);
            padding: 15px;
            border: 1px solid rgb(0, 0, 0);
        }

        footer {
            background-color: rgb(0, 255, 255);
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="logo.png" alt="logo" width="150px" />
            <p>Ini Website Ku</p>
        </header>

        <nav>
            nav
        </nav>

        <div class="main-content">
            <article>
                article
                <section>sec</section>
                <section>sec</section>
                <section>sec</section>
            </article>

            <aside>
                aside
            </aside>
        </div>

        <footer>
            footer
        </footer>
    </div>
</body>
</html>
